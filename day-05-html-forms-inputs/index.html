
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Demo</title>
</head>
<body>

    <header>
        <h1>Student Registration Demo</h1>
        <p>This form is for practice only. It does not save registration details.</p>
    </header>

    <main>
        <form action="#" method="post">

            <fieldset>
                <legend>Student Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" minlength="2" required>
                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="16" max="40" required>
                <br><br>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">Choose a course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="MCA">MCA</option>
                    <option value="BSc">BSc</option>
                </select>
            </fieldset>

            <br>

            <fieldset>
                <legend>Study Mode</legend>

                <input type="radio" id="online" name="mode" value="Online" required>
                <label for="online">Online</label>

                <input type="radio" id="offline" name="mode" value="Offline">
                <label for="offline">Offline</label>
            </fieldset>

            <br>

            <fieldset>
                <legend>Learning Goals</legend>

                <label for="goals">Write your learning goals:</label>
                <br>
                <textarea id="goals" name="goals" rows="4" cols="30"></textarea>
            </fieldset>

            <br>

            <input type="checkbox" id="confirm" name="confirm" required>
            <label for="confirm">I confirm that I am using fictional practice data.</label>

            <br><br>

            <button type="submit">Submit Registration</button>

        </form>
    </main>

    <footer>
        <p>Created for Tech Fellows Day 5.</p>
    </footer>

</body>
</html>
